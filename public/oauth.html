<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connexion Gmail</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5f2; color: #23262b; }
  .box { max-width: 360px; padding: 28px 22px; text-align: center; }
  a { display: inline-block; margin-top: 14px; padding: 14px 22px; border-radius: 12px; background: #e8a33d; color: #23262b; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <h2 id="t">Gmail est connecté</h2>
  <p id="m">Retour dans l’app…</p>
  <a id="go" href="#">Revenir dans l’app</a>
</div>
<script>
  // Retour de Google (connexion Gmail faite dans Chrome): on renvoie le jeton à l'app installée.
  var h = location.hash.slice(1);
  var app = 'com.groupemurco.gestion://oauth#' + h;
  var go = document.getElementById('go');
  go.href = app;
  if (/error=/.test(h)) {
    document.getElementById('t').textContent = 'Connexion annulée';
    document.getElementById('m').textContent = 'Retourne dans l’app et réessaie.';
  }
  setTimeout(function () { location.href = app; }, 300);
</script>
</body>
</html>
